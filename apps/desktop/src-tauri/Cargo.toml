[package]
name = "toolhaven"
version = "1.0.0"
description = "Desktop toolkit for local media, image, PDF and developer workflows"
authors = ["Mirha"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "toolhaven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.3"
ureq = "2.12"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }
sha2 = "0.10"
