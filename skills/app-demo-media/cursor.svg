<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 64 64">
  <!-- 36 CSS px, rasterised by record.mjs at the capture scale into a 64 px
       cursor.png. The tip sits at (10, 8) of those 64 px. -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <path filter="url(#shadow)" transform="translate(10 8) scale(1.95)"
        d="M0 0 L0 17.2 L4.3 13.2 L7.2 19.6 L10 18.4 L7.2 12.2 L13 12.2 Z"
        fill="#ffffff" stroke="#0b0f14" stroke-width="1.15" stroke-linejoin="round"/>
</svg>
